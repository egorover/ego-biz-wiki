  # ============================================================

  - id: eval-036
    question: "Как получить доступ?"
    category: ambiguous
    expected_behavior: clarification
    expected_sources: []
    expected_topics:
      - необходимо уточнить систему или ресурс
      - роль или цель доступа

  - id: eval-037
    question: "Что делать, если устройство потеряно?"
    category: ambiguous
    expected_behavior: clarification
    expected_sources: []
    expected_topics:
      - необходимо уточнить тип устройства
      - корпоративное устройство
      - возможный Security-инцидент

  - id: eval-038
